<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIVORA | Awaken Your Knowledge</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #10243A;
            color: #F5F7FA;
        }

        header {
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2878B8;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #F28C28;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 52px;
            color: #F28C28;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            background: #F28C28;
            color: #10243A;
            padding: 14px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .classes {
            background: #F5F7FA;
            color: #10243A;
            text-align: center;
            padding: 60px 20px;
        }

        .classes h2 {
            margin-bottom: 25px;
            font-size: 32px;
        }

        .class-card {
            display: inline-block;
            background: white;
            border: 2px solid #2878B8;
            padding: 25px 40px;
            margin: 10px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #F5F7FA;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">🔱 SHIVORA</div>
    <nav>
        <a href="#home">Home</a>
        <a href="#classes">Classes</a>
        <a href="#about">About</a>
    </nav>
</header>

<section class="hero" id="home">
    <h1>SHIVORA</h1>
    <p>Awaken Your Knowledge.</p>
    <p>Learn. Practise. Grow.</p>
    <a href="#classes" class="button">Explore Learning</a>
</section>

<section class="classes" id="classes">
    <h2>Choose Your Class</h2>

    <div class="class-card">Class 9</div>
    <div class="class-card">More Classes Coming Soon</div>
</section>

<footer id="about">
    <p>SHIVORA – Awaken Your Knowledge.</p>
    <p>Learn something new every day.</p>
</footer>

</body>
</html>
